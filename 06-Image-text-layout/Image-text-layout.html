<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Card Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../all.css" />
  </head>
  <body>
    <div class="wrap max-width-56p975 primary-green-bg py-0p75 mt-4 container">
      <header>
        <!-- 選單 -->
        <nav>
          <ul
            class="list-unstyled d-flex justify-content-between align-items-center secondary-yellow-bg px-32"
          >
            <li>
              <img src="../img/6.圖文並排/logo.png" alt="品牌標誌" />
            </li>
            <li>
              <a class="fs-6 primary-green" href="#"> more </a>
            </li>
          </ul>
        </nav>
      </header>
      <main class="py-1p75 bg-white">
        <section class="container max-width-48p375">
          <ul class="list-unstyled d-flex">
            <!-- 圖片 -->
            <li class="me-48">
              <img
                class="min-w-11"
                src="../img/6.圖文並排/pic.png"
                alt="甜點圖片"
              />
            </li>
            <!-- 標題、內容、分享 -->
            <li class="pt-8 d-flex flex-column justify-content-between">
              <!-- 標題、內容 -->
              <div>
                <div class="mb-1p25">
                  <h2>想吃甜點 是不需要理由的。</h2>
                </div>
                <div>
                  <p>
                    青山依舊在，幾度夕陽紅。慣看秋月春風。一壺濁酒喜相逢，浪花淘盡英雄。是非成敗轉頭空，滾滾長江東逝水，白髮漁樵江渚上，古今多少事，都付笑談中。
                  </p>
                  <p>
                    是非成敗轉頭空，青山依舊在，幾度夕陽紅。白髮漁樵江渚上，古今多少事，都付笑談中。
                  </p>
                </div>
              </div>
              <!-- 分享 -->
              <div>
                <ul class="list-unstyled d-flex">
                  <li class="me-p75">
                    <a class="primary-green" href="#">FB</a>
                  </li>
                  <li>
                    <a class="primary-green" href="#"> IG分享 </a>
                  </li>
                </ul>
              </div>
            </li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
