<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Card Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../all.css" />
  </head>
  <body>
    <header class="p-5">
      <!-- 品牌標、品牌標 -->
      <div class="py-12p5 secondary-yellow-bg text-center">
        <!-- 品牌標誌 -->
        <div class="mb-6">
          <img
            class="mx-auto"
            src="../img/7.首頁橫幅排版/headerLogo.png"
            alt="品牌標誌"
          />
        </div>
        <!-- 品牌標語 -->
        <h1 class="fs-4 primary-green fw-semibold lh-1p2">
          今天是個吃甜點的好日子
        </h1>
      </div>
      <nav>
        <ul class="list-unstyled d-flex py-3 px-3p5 justify-content-between">
          <li>
            <img src="../img/7.首頁橫幅排版/footerLogo.png" alt="品牌標誌" />
          </li>
          <li>
            <ul class="list-unstyled d-flex">
              <li class="me-1p25 fw-medium">
                <a href="#">回首頁</a>
              </li>
              <li class="me-1p25 fw-medium">
                <a href="#">關於我們</a>
              </li>
              <li class="me-1p25 fw-medium">
                <a href="#">產品介紹</a>
              </li>
              <li class="fw-medium">
                <a href="#">聯絡我們</a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
