<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Card Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../all.css" />
  </head>
  <body>
    <main class="p-5">
      <section>
        <div class="container max-width-59p5">
          <div class="row">
            <div class="col-5 max-w-18p75">
              <ul class="list-unstyled text-center">
                <li>
                  <a
                    class="menu border border-secondary-gray fs-9 primary-green fw-semibold menu-active py-3"
                    href=""
                  >
                    甜點類別</a
                  >
                </li>
                <li>
                  <a
                    class="menu border border-secondary-gray fs-9 primary-green fw-semibold py-3"
                    href=""
                  >
                    甜點類別</a
                  >
                </li>
                <li>
                  <a
                    class="menu border border-secondary-gray fs-9 primary-green fw-semibold py-3"
                    href=""
                  >
                    甜點類別</a
                  >
                </li>
                <li>
                  <a
                    class="menu border border-secondary-gray fs-9 primary-green fw-semibold py-3"
                    href=""
                  >
                    甜點類別</a
                  >
                </li>
                <li>
                  <a
                    class="menu border border-secondary-gray fs-9 primary-green fw-semibold py-3"
                    href=""
                  >
                    甜點類別</a
                  >
                </li>
              </ul>
            </div>
            <div class="col">
              <ul
                class="menu-card list-unstyled d-flex flex-wrap max-width-38p75"
              >
                <li class="mb-1p25 max-w-20">
                  <div>
                    <img src="../img/10.產品列表/pic1.png" alt="甜甜圈" />
                    <p
                      class="primary-green fw-medium fs-7 border border-secondary-gray d-flex text-nowrap"
                    >
                      <span class="px-2p75 py-3 d-inline-block">無糖甜圈圈</span
                      ><span
                        class="p-3 d-inline-block border-start border-secondary-gray"
                        >NT$ 450</span
                      >
                    </p>
                  </div>
                  <a
                    type="button"
                    class="py-4 px-5p625 primary-green fw-semibold fs-4 bg-primary-green"
                  >
                    加入購物車
                  </a>
                </li>
                <li class="mb-1p25 max-w-20">
                  <div>
                    <img src="../img/10.產品列表/pic1.png" alt="甜甜圈" />
                    <p
                      class="primary-green fw-medium fs-7 border border-secondary-gray d-flex text-nowrap"
                    >
                      <span class="px-2p75 py-3 d-inline-block">無糖甜圈圈</span
                      ><span
                        class="p-3 d-inline-block border-start border-secondary-gray"
                        >NT$ 450</span
                      >
                    </p>
                  </div>
                  <a
                    type="button"
                    class="py-4 px-5p625 primary-green fw-semibold fs-4 bg-primary-green"
                  >
                    加入購物車
                  </a>
                </li>
                <li class="mb-1p25 max-w-20">
                  <div>
                    <img src="../img/10.產品列表/pic1.png" alt="甜甜圈" />
                    <p
                      class="primary-green fw-medium fs-7 border border-secondary-gray d-flex text-nowrap"
                    >
                      <span class="px-2p75 py-3 d-inline-block">無糖甜圈圈</span
                      ><span
                        class="p-3 d-inline-block border-start border-secondary-gray"
                        >NT$ 450</span
                      >
                    </p>
                  </div>
                  <a
                    type="button"
                    class="py-4 px-5p625 primary-green fw-semibold fs-4 bg-primary-green"
                  >
                    加入購物車
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
